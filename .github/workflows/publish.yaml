name: Publish action

on:
  create:
    tag:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v2
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: setup jdk 17
        uses: actions/setup-java@v1
        with:
          java-version: "17"
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: Publish Minecraft Mods Forge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 281316
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            Forge/build/libs/!(*-@(dev|sources|javadoc)).jar
            Forge/build/libs/*-@(dev|sources|javadoc).jar
          version-type: release
          loaders: forge
          game-versions: 1.21.1
          java: 21
          name: ""
          changelog: "https://github.com/Buuz135/ArmoreableMobs/commits/1.21.1"
      - name: Publish Minecraft Mods Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 281316
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            Fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            Fabric/build/libs/*-@(dev|sources|javadoc).jar
          version-type: release
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          name: ""
          changelog: "https://github.com/Buuz135/ArmoreableMobs/commits/1.21.1"