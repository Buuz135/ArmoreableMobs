name: Publish action

on:
  create:
    tag:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v2
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: setup jdk 21
        uses: actions/setup-java@v1
        with:
          java-version: "21"
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: Publish Minecraft Mods Neoforge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 281316
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
            neoforge/build/libs/*-@(dev|sources|javadoc).jar
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          name: ""
          changelog: "https://github.com/Buuz135/ArmoreableMobs/commits/1.21.1"
      - name: Publish Minecraft Mods Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 281316
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            fabric/build/libs/*-@(dev|sources|javadoc).jar
          version-type: release
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          name: ""
          changelog: "https://github.com/Buuz135/ArmoreableMobs/commits/1.21.1"